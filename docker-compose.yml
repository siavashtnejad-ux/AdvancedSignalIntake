services:
  app:
    build: .
    container_name: advanced-signal-intake-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      EH_DB_PATH: /app/data/ethical_horizon.db
    volumes:
      - ./data:/app/data
    expose:
      - "8080"
    networks:
      - appnet

  caddy:
    image: caddy:2-alpine
    container_name: advanced-signal-intake-caddy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - appnet

networks:
  appnet:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
