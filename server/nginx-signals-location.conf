# Add these location blocks INSIDE the existing server { ... } block
# that currently listens on port 80 for 85.198.17.18.

location = /signals {
    return 301 /signals/;
}

location /signals/ {
    proxy_pass http://127.0.0.1:8081/;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /signals;

    proxy_connect_timeout 10s;
    proxy_send_timeout 180s;
    proxy_read_timeout 180s;
    client_max_body_size 10m;
}

# The current stylesheet references the hero image from the web root.
# This exact-match proxy avoids touching any other assets of your existing site.
location = /header-hero.webp {
    proxy_pass http://127.0.0.1:8081/header-hero.webp;
    proxy_set_header Host $host;
}
