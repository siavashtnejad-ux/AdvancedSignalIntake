version: "3.8"

services:
  app:
    build: .
    container_name: advanced-signal-intake-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      EH_ROOT_PATH: /signals
      EH_DB_PATH: /app/data/ethical_horizon.db
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:8081:8080"
